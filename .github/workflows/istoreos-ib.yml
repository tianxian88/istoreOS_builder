name: Build iStoreOS 24.10 Custom Firmware

on:
  workflow_dispatch: # 支持手动触发编译
  push:
    branches: [ "main" ]
    paths:
      - 'custom_packages.txt'    # 修改第三方链接时触发
      - 'official_packages.txt'  # 修改官方包名列表时触发
      - 'files/**'               # 修改自定义 etc 等文件时触发
      - 'modify.sh'              # 修改自定义编译脚本时触发
      - '.github/workflows/**'

env:
  # iStoreOS 24.10 (x86_64) ImageBuilder 官方下载地址
  IB_URL: https://fw20.koolcenter.com/iStoreOS/ib/24.10/x86_64/istoreos-imagebuilder-x86-64.Linux-x86_64.tar.zst
jobs:
  build:
    runs-on: ubuntu-22.04
    # 赋予工作流创建 Release 和删除历史记录的完整权限
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zstd

      - name: Download and Extract ImageBuilder
        run: |
          mkdir -p openwrt-ib
          echo "📥 开始下载 iStoreOS ImageBuilder..."
          wget -qO ib_archive.tar.zst "${{ env.IB_URL }}"
          if [ ! -s "ib_archive.tar.zst" ]; then
            echo "❌ 错误: 固件生成器下载失败！请检查链接是否有效。"
            exit 1
          fi
          echo "📦 下载完成，正在解压固件生成器..."
          tar --zstd -xf ib_archive.tar.zst -C openwrt-ib --strip-components=1
          rm -f ib_archive.tar.zst
          echo "✅ 固件生成器准备就绪！"

      - name: Load Official Packages List
        run: |
          if [ ! -f "official_packages.txt" ]; then
            echo "⚠️ Warning: official_packages.txt not found, using empty list."
            echo "OFFICIAL_PKGS=" >> $GITHUB_ENV
            exit 0
          fi
          
          # 精准清洗：过滤掉注释行、空行和 Windows 换行符，将多行包名完美转换为单行空格分隔
          OFFICIAL_PKGS=$(cat official_packages.txt | grep -v '^#' | grep -v '^$' | tr '\r' ' ' | tr '\n' ' ')
          
          echo "📦 Loaded Official Packages: $OFFICIAL_PKGS"
          echo "OFFICIAL_PKGS=$OFFICIAL_PKGS" >> $GITHUB_ENV


      - name: Download Third-Party IPKs from File
        run: |
          if [ ! -f "custom_packages.txt" ]; then
            echo "⚠️ Warning: custom_packages.txt not found, skipping."
            echo "CUSTOM_PKGS=" >> $GITHUB_ENV
            exit 0
          fi

          # 物理锁定唯一的存放和解压目录
          PKG_DIR="$(pwd)/openwrt-ib/packages"
          mkdir -p "$PKG_DIR"
          
          # 用于记录最终需要打包的自定义包名集合
          CUSTOM_PKGS=""
          count=0
          
          # 核心优化：利用 IFS=',' 原生机制自动将每一行拆分为 $pkg_name 和 $url
          while IFS=',' read -r raw_pkg raw_url || [ -n "$raw_pkg" ]; do
            # 彻底清洗两边可能存在的隐形空格和回车符
            pkg_name=$(echo "$raw_pkg" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/\r//g')
            url=$(echo "$raw_url" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/\r//g')
            
            # 过滤掉注释行和空行（如果整行是注释，pkg_name 会以 # 开头）
            [[ "$pkg_name" =~ ^# ]] && continue
            [[ -z "$pkg_name" ]] && continue
            
            count=$((count+1))
            echo "🎯 [第 ${count} 步] 直接读取包名: [$pkg_name] | 发起原生下载..."
            
            # 1. 将精确拿到的包名直接追加到全局编译列表中（去重收录）
            if [[ ! " $CUSTOM_PKGS " == *" $pkg_name "* ]]; then
              CUSTOM_PKGS="$CUSTOM_PKGS $pkg_name"
            fi
            
            # 2. 切换到 packages 目录，直接以网络原名下载
            cd "$PKG_DIR"
            wget -q "$url"
            
            # 3. 即下即解即删：如果是压缩包，立即就地解压并瞬间消灭自身
            if ls *.tar.gz >/dev/null 2>&1 || ls *.tgz >/dev/null 2>&1; then
              echo "📦 发现压缩包，立即就地解压并删除自身..."
              tar -zxf *.tar.gz 2>/dev/null || tar -zxf *.tgz 2>/dev/null
              rm -f *.tar.gz *.tgz 2>/dev/null
            fi
            
            # 回到外层仓库根目录，准备读取下一行
            cd - >/dev/null
            echo "--------------------------------------------------"
          done < custom_packages.txt
          
          # 4. 所有网络流式下载与解压全部完成后，统一处理可能存在的嵌套文件夹即可
          cd "$PKG_DIR"
          find . -mindepth 2 -name "*.ipk" -exec mv {} . \;
          
          echo "📦 Final Extracted Custom Packages: $CUSTOM_PKGS"
          echo "CUSTOM_PKGS=$CUSTOM_PKGS" >> $GITHUB_ENV



      - name: Execute Custom Modify Script
        run: |
          if [ -f "modify.sh" ]; then
            echo "🏃 发现修改脚本，赋予执行权限并运行..."
            chmod +x modify.sh
            cp modify.sh openwrt-ib/
            cd openwrt-ib
            ./modify.sh
            rm modify.sh
          else
            echo "ℹ️ 未发现 modify.sh 脚本，跳过自定义修改步骤。"
          fi

      - name: Prepare Custom Files
        run: |
          if [ -d "files" ]; then
            echo "📂 Custom files directory found."
            echo "CUSTOM_FILES_PATH=\((pwd)/files" >> \)GITHUB_ENV
          else
            echo "ℹ️ No custom files directory found."
            echo "CUSTOM_FILES_PATH=" >> \$GITHUB_ENV
          fi

      - name: Generate Firmware Image
        run: |
          cd openwrt-ib
          
          # 1. 组合最终包名
          FINAL_PKGS="luci-base luci-compat $OFFICIAL_PKGS $CUSTOM_PKGS"
          echo "🚀 Final packages list passing to make image: $FINAL_PKGS"
          
          # 2. 安全加引号防御空变量，动态决定是否注入 FILES 参数
          if [ -n "${{ env.CUSTOM_FILES_PATH }}" ]; then
            echo "🛠️ Injecting custom files from: ${{ env.CUSTOM_FILES_PATH }}"
            make image PROFILE="generic" PACKAGES="$FINAL_PKGS" FILES="${{ env.CUSTOM_FILES_PATH }}"
          else
            echo "ℹ️ Building standard image without extra files."
            make image PROFILE="generic" PACKAGES="$FINAL_PKGS"
          fi


      - name: Organize Files and Extract Version
        run: |
          mkdir -p ./artifact
          
          # 1. 从 .config 中精确提取 iStoreOS 官方的版本号
          ISTOREOS_VERSION=$(grep "CONFIG_VERSION_NUMBER=" openwrt-ib/.config | cut -d'"' -f2)
          BUILD_DATE=$(date +%Y%m%d)
          
          # 2. 将版本号与日期存入全局环境变量，供后续 Release 步骤调用
          echo "FIRMWARE_VERSION=${ISTOREOS_VERSION}" >> $GITHUB_ENV
          echo "BUILD_TAG=${ISTOREOS_VERSION}-${BUILD_DATE}" >> $GITHUB_ENV
          
          # 3. 收集固件并优雅地重命名（拆分为两条独立的 find 语句，彻底杜绝括号语法冲突）
          
          # 第一轮：搜集带 sysupgrade 的固件
          find openwrt-ib/bin/targets/ -type f -name "*sysupgrade*" | while read -r file; do
            filename=$(basename "$file")
            if [[ "$filename" != *"vmlinux"* ]]; then
              custom_name="iStoreOS-${ISTOREOS_VERSION}-x86-64-${filename}"
              cp "$file" "./artifact/${custom_name}"
              echo "📄 Saved artifact: ${custom_name}"
            fi
          done
          
          # 第二轮：搜集带 combined 的固件
          find openwrt-ib/bin/targets/ -type f -name "*combined*" | while read -r file; do
            filename=$(basename "$file")
            if [[ "$filename" != *"vmlinux"* ]]; then
              custom_name="iStoreOS-${ISTOREOS_VERSION}-x86-64-${filename}"
              # 避免第一轮重复拷贝相同的文件
              if [ ! -f "./artifact/${custom_name}" ]; then
                cp "$file" "./artifact/${custom_name}"
                echo "📄 Saved artifact: ${custom_name}"
              fi
            fi
          done
          
          # 4. 生成编译日志说明
          echo "### iStoreOS 定制固件自动化发布" > ./artifact/release_notes.md
          echo "* **基准版本**: ${ISTOREOS_VERSION}" >> ./artifact/release_notes.md
          echo "* **编译时间**: $(date '+%Y-%m-%d %H:%M:%S')" >> ./artifact/release_notes.md


      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: iStoreOS  [${{ env.FIRMWARE_VERSION }}]
          body_path: ./artifact/release_notes.md
          files: ./artifact/iStoreOS-*
          fail_on_unmatched_files: false # 【加固】如果文件匹配遇到死锁，防止整个流崩塌
          token: ${{ github.token }}     # 【修复】直接调用系统的上下文 token 强制对齐顶部 contents: write 权限

