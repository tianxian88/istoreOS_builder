name: Build iStoreOS x86_64 & Auto Release

on:
  workflow_dispatch: # 支持手动触发编译
  push:
    branches: [ "main" ]
    paths:
      - 'custom_packages.txt'    # 修改第三方链接时触发
      - 'official_packages.txt'  # 修改官方包名列表时触发
      - 'files/**'               # 修改自定义 etc 等文件时触发
      - 'modify.sh'              # 修改自定义编译脚本时触发
      - '.github/workflows/**'

env:
  # iStoreOS ImageBuilder 下载地址（以 x86_64 架构为例）
  IB_URL: https://fw20.koolcenter.com/iStoreOS/ib/x86_64/istoreos-imagebuilder-x86-64.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04
    # 赋予工作流创建 Release 和删除历史记录的权限
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zstd

      - name: Download and Extract ImageBuilder
        run: |
          mkdir -p openwrt-ib
          echo "📥 开始下载 iStoreOS ImageBuilder..."
          
          # 下载为本地实体临时文件
          wget -qO ib_archive.tar.zst "${{ env.IB_URL }}"
          
          # 验证文件是否存在且不为空（防止下载到 404 网页或网络中断断流）
          if [ ! -s "ib_archive.tar.zst" ]; then
            echo "❌ 错误: 固件生成器下载失败！请检查链接是否有效: ${{ env.IB_URL }}"
            exit 1
          fi
          
          echo "📦 下载完成，正在解压固件生成器..."
          tar --zstd -xf ib_archive.tar.zst -C openwrt-ib --strip-components=1
          
          # 解压完成，及时清理缓存文件
          rm -f ib_archive.tar.zst
          echo "✅ 固件生成器准备就绪！"

      - name: Load Official Packages List
        run: |
          if [ ! -f "official_packages.txt" ]; then
            echo "⚠️ Warning: official_packages.txt not found, using empty list."
            echo "OFFICIAL_PKGS=" >> \$GITHUB_ENV
            exit 0
          fi

          OFFICIAL_PKGS=\((grep -v '^#' official_packages.txt \vert{} grep -v '^\)' | tr '\n' ' ')
          echo "📦 Loaded Official Packages: \$OFFICIAL_PKGS"
          echo "OFFICIAL_PKGS=\(OFFICIAL_PKGS" >> \)GITHUB_ENV

      - name: Download Third-Party IPKs from File
        run: |
          if [ ! -f "custom_packages.txt" ]; then
            echo "⚠️ Warning: custom_packages.txt not found, skipping."
            echo "CUSTOM_PKGS=" >> $GITHUB_ENV
            exit 0
          fi

          # 锁定绝对路径
          PKG_DIR="$(pwd)/openwrt-ib/packages"
          mkdir -p "$PKG_DIR"
          
          # 用于记录最终需要打包的自定义包名集合
          CUSTOM_PKGS=""
          count=0
          
          # 读取链接文件并处理
          while read -r line || [ -n "$line" ]; do
            # 过滤掉注释行和空行
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            
            count=$((count+1))
            custom_prefix=""
            url=""
            
            # 智能解析：支持逗号或分号分隔
            if [[ "$line" == *","* ]]; then
              custom_prefix=$(echo "$line" | cut -d',' -f1 | tr -d ' ')
              url=$(echo "$line" | cut -d',' -f2- | tr -d ' ')
            elif [[ "$line" == *";"* ]]; then
              custom_prefix=$(echo "$line" | cut -d';' -f1 | tr -d ' ')
              url=$(echo "$line" | cut -d';' -f2- | tr -d ' ')
            else
              url=$(echo "$line" | tr -d ' ')
            fi

            # 提取去除参数后的纯净基础文件名
            pure_url="${url%%?*}"
            orig_filename=$(basename "$pure_url")
            lower_orig_filename=$(echo "$orig_filename" | tr 'A-Z' 'a-z')
            
            # 核心逻辑：判断原文件名是否是压缩包
            if [[ "$lower_orig_filename" == *".tar.gz" ]] || [[ "$lower_orig_filename" == *".tgz" ]]; then
              # 如果是压缩包，强制使用防冲突命名
              if [ -n "$custom_prefix" ]; then
                download_filename="${custom_prefix}_${orig_filename}"
              else
                download_filename="${count}_${orig_filename}"
              fi
              is_tarball=true
              echo "📥 Line [${count}] -> [TAR格式] 重命名为: $download_filename | URL: $url"
            else
              # 如果是普通的 .ipk 文件，保持原汁原味的文件名不改动
              download_filename="$orig_filename"
              is_tarball=false
              echo "📥 Line [${count}] -> [IPK格式] 保持原文件名: $download_filename | URL: $url"
            fi
            
            # 执行下载到指定的目标 packages 目录中
            wget -qO "$PKG_DIR/$download_filename" "$url"
            
            if [ ! -s "$PKG_DIR/$download_filename" ]; then
              echo "❌ Error: Failed to download or file is empty: $url"
              rm -f "$PKG_DIR/$download_filename"
              continue
            fi

            # 如果是压缩包，使用正确的小写变量执行解压，并释放到 $PKG_DIR 中
            if [ "$is_tarball" = true ]; then
              echo "📦 Extracting tarball: $download_filename"
              tar -zxf "$PKG_DIR/$download_filename" -C "$PKG_DIR"
              rm -f "$PKG_DIR/$download_filename"
            fi
          done < custom_packages.txt
          
          # 切换到 packages 目录执行扁平化和包名提取
          cd "$PKG_DIR"
          
          # 【扁平化处理】如果压缩包解压出了嵌套文件夹，把深层目录下的 .ipk 全部移动到当前根目录下
          find . -mindepth 2 -name "*.ipk" -exec mv {} . \;
          
          # 动态扫描当前所有实际存在的 .ipk 文件，精准提取包名
          for file in *.ipk; do
            if [ -f "$file" ]; then
              pkg_name=$(echo "$file" | cut -d'_' -f1)
              # 避免重复添加包名
              if [[ ! " $CUSTOM_PKGS " == *" $pkg_name "* ]]; then
                CUSTOM_PKGS="$CUSTOM_PKGS $pkg_name"
              fi
            fi
          done
          
          echo "📦 Final Extracted Custom Packages: $CUSTOM_PKGS"
          echo "CUSTOM_PKGS=$CUSTOM_PKGS" >> $GITHUB_ENV


      - name: Execute Custom Modify Script
        run: |
          if [ -f "modify.sh" ]; then
            echo "🏃 发现修改脚本，赋予执行权限并运行..."
            chmod +x modify.sh
            cp modify.sh openwrt-ib/
            cd openwrt-ib
            ./modify.sh
            rm modify.sh
          else
            echo "ℹ️ 未发现 modify.sh 脚本，跳过自定义修改步骤。"
          fi

      - name: Prepare Custom Files
        run: |
          if [ -d "files" ]; then
            echo "📂 Custom files directory found."
            echo "IB_FILES_PARAM=FILES=(pwd)/files" >> GITHUB_ENV
          else
            echo "ℹ️ No custom files directory found, skipping file integration."
            echo "IB_FILES_PARAM=" >> \$GITHUB_ENV
          fi

      - name: Generate Firmware Image
        run: |
          cd openwrt-ib
          
          # 1. 严格使用单行空格拼接，并在 shell 中完成组合
          # 注意：不要在 YAML 层用反斜杠转义 $，直接用 Linux Shell 的标准变量语法
          FINAL_PKGS="luci-base luci-compat $OFFICIAL_PKGS $CUSTOM_PKGS"
          
          echo "🚀 Final packages list passing to make image: $FINAL_PKGS"
          echo "🛠️ Files Parameter: ${{ env.IB_FILES_PARAM }}"
          
          # 2. 执行打包命令，把变量用双引号包裹以防空格截断
          # 同时使用三元判断或直接传递环境变量
          make image PROFILE="generic" PACKAGES="$FINAL_PKGS" ${{ env.IB_FILES_PARAM }}


      - name: Organize Files and Extract Version
        run: |
          mkdir -p ./artifact
          
          # 1. 动态提取 iStoreOS 官方版本号
          ISTOREOS_VERSION=\$(grep "CONFIG_VERSION_NUMBER=" openwrt-ib/.config | cut -d'"' -f2)
          BUILD_DATE=\$(date +%Y%m%d)
          
          # 2. 将版本号与日期存入全局环境变量，供后续 Release 步骤调用
          echo "FIRMWARE_VERSION=\({ISTOREOS_VERSION}" >> \)GITHUB_ENV
          echo "BUILD_TAG=\${ISTOREOS_VERSION}-\({BUILD_DATE}" >> \)GITHUB_ENV
          
          # 3. 收集固件并优雅地重命名
          find openwrt-ib/bin/targets/ -type f  -name "*sysupgrade*" -o -name "*combined*"  | while read -r file; do
            filename=(basename "file")
            # 过滤掉中间生成的无用符号文件
            if [[ "\$filename" != *"vmlinux"* ]]; then
              custom_name="iStoreOS-\({ISTOREOS_VERSION}-x86_64-\){filename}"
              cp "file" "./artifact/{custom_name}"
              echo "📄 Saved artifact as: \${custom_name}"
            fi
          done
          
          # 4. 生成编译日志说明
          echo "### 固件定制信息" > ./artifact/release_notes.md
          echo "* **iStoreOS 基准版本**: \${ISTOREOS_VERSION}" >> ./artifact/release_notes.md
          echo "* **编译日期**: \$(date '+%Y-%m-%d %H:%M:%S')" >> ./artifact/release_notes.md
          echo "* **集成的自定义插件**: " >> ./artifact/release_notes.md
          echo "\`\`\`" >> ./artifact/release_notes.md
          echo "${{ env.CUSTOM_PKGS }}" | tr ' ' '\n' >> ./artifact/release_notes.md
          echo "\`\`\`" >> ./artifact/release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ env.BUILD_TAG }}
          name: iStoreOS 固件定制版 [\${{ env.FIRMWARE_VERSION }}]
          body_path: ./artifact/release_notes.md
          files: ./artifact/iStoreOS-*
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          retain_days: 0          # 不保留过往历史的天数（可根据需要设为 1 或 3）
          keep_minimum_runs: 1    # 仅保留最近成功的 1 次运行记录，其余全部自动删除
